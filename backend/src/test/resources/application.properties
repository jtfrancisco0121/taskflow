# Integration tests that exercise the relay switch it on with
# @TestPropertySource(properties = "taskflow.outbox.enabled=true"); the rest keep their outbox rows.
taskflow.outbox.enabled=false
# The same for the RabbitMQ relay and the workers (listeners, due sweep): only the tests of those parts
# switch them on with @TestPropertySource, so other tests do not race with asynchronous work.
taskflow.outbox.amqp.enabled=false
taskflow.workers.enabled=false
