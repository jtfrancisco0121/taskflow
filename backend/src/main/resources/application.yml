spring:
  application:
    name: taskflow
  datasource:
    url: ${TASKFLOW_DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${TASKFLOW_DB_USER:taskflow}
    password: ${TASKFLOW_DB_PASSWORD:taskflow}
    hikari:
      # Shared by HTTP, both relays, the due sweep and the consumers; each consumer holds one
      # connection at a time (decision 009).
      maximum-pool-size: ${TASKFLOW_DB_POOL_SIZE:20}
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  jooq:
    sql-dialect: postgres
  mvc:
    problemdetails:
      enabled: true
  data:
    redis:
      host: ${TASKFLOW_REDIS_HOST:localhost}
      port: ${TASKFLOW_REDIS_PORT:6379}
      # A hung Redis call must not stall the relay or the presence sweep (AD-11).
      timeout: 2s
  rabbitmq:
    host: ${TASKFLOW_RABBITMQ_HOST:localhost}
    port: ${TASKFLOW_RABBITMQ_PORT:5672}
    username: ${TASKFLOW_RABBITMQ_USER:taskflow}
    password: ${TASKFLOW_RABBITMQ_PASSWORD:taskflow}
    # A hung broker must not stall the AMQP relay (AD-2).
    connection-timeout: 2s
    publisher-confirm-type: correlated
  task:
    scheduling:
      pool:
        size: 4
  mail:
    host: ${TASKFLOW_MAIL_HOST:localhost}
    port: ${TASKFLOW_MAIL_PORT:1025}

server:
  port: ${TASKFLOW_PORT:8080}
  # The client IP (sign-in rate limit, failed-key log) comes from X-Forwarded-For only when the
  # connection is from a proxy in taskflow.http.trusted-proxies (decision 005.14, TrustedProxyConfig).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Tomcat trusts private ranges by default; trust nothing unless proxies are listed.
      internal-proxies: ""

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

taskflow:
  outbox:
    # Publishes committed outbox rows to Redis (AD-11).
    enabled: true
    interval-ms: 250
    amqp:
      # Publishes committed outbox rows to RabbitMQ for the automation and notification consumers.
      enabled: true
  workers:
    # Gates the RabbitMQ listeners and the due-date sweep (decision 009.4).
    enabled: true
  api-keys:
    rate-limit:
      # Calls per key per minute, by plan (PRD open question 6). Every Workspace is on "default".
      plans:
        default: 100
  app-url: ${TASKFLOW_APP_URL:http://localhost:5173}
  http:
    # Comma-separated IP addresses of reverse proxies allowed to set X-Forwarded-For. Empty trusts
    # none, so the TCP peer is the client IP (decision 005.14).
    trusted-proxies: ${TASKFLOW_TRUSTED_PROXIES:}
  jwt:
    # No default outside the dev profile: startup fails when it is empty or shorter than 32 bytes.
    secret: ${TASKFLOW_JWT_SECRET:}

springdoc:
  writer-with-order-by-keys: true
  paths-to-match: /api/v1/**
